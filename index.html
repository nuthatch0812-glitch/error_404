<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아리타 자기와 조선 도공의 역사</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Section 1: 아리타 자기 전시 -->
    <section id="hero" class="hero-section">
        <div class="pottery-container">
            <svg id="pottery-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                <!-- 자기 기본 형태 (SVG로 구현 또는 이미지) -->
                <defs>
                    <filter id="crack-mask">
                        <feImage href="#crack-pattern"/>
                    </filter>
                </defs>
                <g id="pottery-main" class="pottery">
                    <!-- 자기 기본 형태 -->
                    <ellipse cx="200" cy="150" rx="120" ry="140" fill="#fef5e7" stroke="#8b7355" stroke-width="2"/>
                    <!-- 붉은 문양 -->
                    <g id="red-pattern" class="pattern">
                        <path d="M 100 200 Q 150 190 200 200 Q 250 210 300 200" stroke="#d32f2f" stroke-width="3" fill="none"/>
                        <circle cx="120" cy="200" r="8" fill="#d32f2f"/>
                        <circle cx="200" cy="185" r="8" fill="#d32f2f"/>
                        <circle cx="280" cy="200" r="8" fill="#d32f2f"/>
                    </g>
                </g>
                <!-- 금 패턴 (처음엔 숨겨짐) -->
                <g id="crack-lines" class="cracks">
                    <path id="crack-1" class="crack" d="M 200 150 L 200 250" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <path id="crack-2" class="crack" d="M 150 200 L 250 200" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
                </g>
            </svg>
            <div class="pottery-info">
                <h2 id="pottery-title">아리타 자기</h2>
                <p id="pottery-date">17세기 초</p>
            </div>
        </div>
    </section>

    <!-- Section 2: 균열 애니메이션 -->
    <section id="crack-section" class="crack-section">
        <canvas id="crack-canvas" width="1200" height="800"></canvas>
    </section>

    <!-- Section 3: 지도와 이동 경로 -->
    <section id="map-section" class="map-section">
        <div class="map-container">
            <svg id="migration-map" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
                <!-- 지도 배경 -->
                <rect width="1000" height="600" fill="#fef5e7"/>
                
                <!-- 대륙 및 지역 표시 -->
                <g id="map-regions">
                    <!-- 조선 -->
                    <polygon id="joseon" points="200,150 250,140 280,200 250,250 180,240" fill="#e8d5c4" stroke="#999" stroke-width="2"/>
                    <!-- 규슈 -->
                    <polygon id="kyushu" points="400,250 450,240 470,300 420,310" fill="#e8d5c4" stroke="#999" stroke-width="2"/>
                    <!-- 아리타 -->
                    <circle id="arita" cx="430" cy="280" r="15" fill="#d32f2f" stroke="#999" stroke-width="2"/>
                </g>

                <!-- 이동 경로 (붉은 문양 선을 이용) -->
                <g id="migration-path" class="path-group">
                    <path id="route-line" d="M 250 200 Q 330 220 430 280" stroke="#d32f2f" stroke-width="4" fill="none" stroke-dasharray="0,1000" stroke-linecap="round"/>
                    <!-- 정착지 마크 -->
                    <circle cx="250" cy="200" r="8" fill="#333"/>
                    <circle cx="430" cy="280" r="8" fill="#333"/>
                </g>

                <!-- 도공 정보 -->
                <g id="potters-info" class="info-labels">
                    <!-- 동적으로 추가될 요소 -->
                </g>
            </svg>
        </div>
    </section>

    <!-- Section 4: 재결합된 자기 -->
    <section id="final-section" class="final-section">
        <div class="reassembled-pottery">
            <svg id="reassembled-svg" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
                <g id="reassembled-pottery-main" class="reassembled">
                    <!-- 재결합된 자기 조각들 -->
                    <g id="pottery-piece-0" class="pottery-piece">
                        <path d="M 200 150 L 220 140 L 240 160 L 220 200 L 180 180" fill="#fef5e7" stroke="#8b7355" stroke-width="2"/>
                    </g>
                    <!-- 추가 조각들... -->
                </g>
                <!-- 균열 텍스트 -->
                <g id="crack-text" class="crack-annotations">
                    <!-- 도공 이름과 연도 -->
                </g>
            </svg>
        </div>
        <div class="credits">
            <h3>아리타 자기와 조선 도공</h3>
            <p>도공들의 이름과 기여를 기억하며</p>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
